{% extends "base.html" %}
{% block title %}Login — Smart E-Waste{% endblock %}
{% block content %}
<div class="row justify-content-center py-4 fade-in">
    <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="card">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div style="font-size: 2.5rem; margin-bottom: 0.5rem; filter: drop-shadow(0 0 15px rgba(65, 222, 253, 0.3));">
                        <i class="bi bi-box-arrow-in-right" style="color: var(--neon);"></i>
                    </div>
                    <h3 class="mb-1" style="font-family: var(--font-display);">Welcome Back</h3>
                    <p class="text-muted mb-0" style="font-size: 0.88rem;">Sign in to your eco-warrior account</p>
                </div>
                <form method="post" autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label">Email or Username</label>
                        <div class="input-group">
                            <span class="input-group-text" style="background: var(--surface-container-highest); border-color: var(--ghost-border); color: var(--muted);"><i class="bi bi-person"></i></span>
                            <input type="text" name="email" class="form-control" placeholder="Email or username" autocomplete="off" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text" style="background: var(--surface-container-highest); border-color: var(--ghost-border); color: var(--muted);"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Enter your password" autocomplete="off" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success w-100 btn-lg"><i class="bi bi-lightning-charge me-2"></i>Login</button>
                </form>
                <div class="text-center mt-4">
                    <p class="mb-0" style="font-size: 0.9rem;">New user? <a href="{{ url_for('register') }}" style="font-weight: 600;">Create an account</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
